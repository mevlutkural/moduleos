name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    needs: [source-quality, integration, operations, container, deploy-assets, stack-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on missing, skipped, cancelled, or failed qualification
        env:
          SOURCE_RESULT: ${{ needs.source-quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DEPLOY_RESULT: ${{ needs.deploy-assets.result }}
          STACK_RESULT: ${{ needs.stack-smoke.result }}
        run: |
          for result in "$SOURCE_RESULT" "$INTEGRATION_RESULT" "$OPERATIONS_RESULT" "$CONTAINER_RESULT" "$DEPLOY_RESULT" "$STACK_RESULT"; do
            test "$result" = success || exit 1
          done

  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Verify formatting
        env:
          GOTOOLCHAIN: local
        run: test -z "$(gofmt -l .)"
      - name: Validate workflows
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify module files are tidy
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff
      - name: Verify module dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod verify
      - name: Run static analysis
        env:
          GOTOOLCHAIN: local
        run: go vet ./...
      - name: Run static analysis on the container suite
        env:
          GOTOOLCHAIN: local
        run: go vet -tags container ./apps/control-plane/containertest/...
      - name: Run static analysis on the stack suite
        env:
          GOTOOLCHAIN: local
        run: go vet -tags stack ./deploy/swarm/stacktest/...
      - name: Run static analysis on the operational suite
        env:
          GOTOOLCHAIN: local
        run: go vet -tags operations ./deploy/swarm/operations/...
      - name: Build all packages
        env:
          GOTOOLCHAIN: local
        run: go build ./...
      - name: Qualify moduleosd process lifecycle
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 -v -timeout=3m ./apps/control-plane/cmd/moduleosd
      - name: Verify static moduleosd builds
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-moduleosd-build.sh
      - name: Run tests
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 ./...
      - name: Verify OpenAPI contract
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-openapi.sh
      - name: Verify generated checks leave no changes
        run: git diff --exit-code

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Enforce coverage policy
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-coverage.sh

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Run race-enabled tests
        env:
          GOTOOLCHAIN: local
        run: go test -race -count=1 ./...

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Qualify real Docker and Swarm integration
        env:
          GOTOOLCHAIN: local
          MODULEOS_INTEGRATION_DISPOSABLE: "1"
        run: ./scripts/check-swarm-integration.sh

  operations:
    name: Operational qualification (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Qualify real black-box operations
        env:
          GOTOOLCHAIN: local
          MODULEOS_OPERATIONS_DISPOSABLE: "1"
          MODULEOS_OPERATIONS_EVIDENCE_DIR: ${{ runner.temp }}/moduleos-operations-evidence
        run: |
          mkdir -m 0700 "$MODULEOS_OPERATIONS_EVIDENCE_DIR"
          sudo env PATH="$PATH" GOTOOLCHAIN=local MODULEOS_OPERATIONS_DISPOSABLE=1 MODULEOS_OPERATIONS_EVIDENCE_DIR="$MODULEOS_OPERATIONS_EVIDENCE_DIR" bash scripts/check-operations.sh
      - name: Publish sanitized operational summary
        if: ${{ always() }}
        env:
          GOTOOLCHAIN: local
          MODULEOS_OPERATIONS_EVIDENCE_DIR: ${{ runner.temp }}/moduleos-operations-evidence
        run: |
          if sudo test -f "$MODULEOS_OPERATIONS_EVIDENCE_DIR/results.jsonl"; then
            summary=$(sudo env PATH="$PATH" GOTOOLCHAIN=local go run ./deploy/swarm/operations/cmd/summary "$MODULEOS_OPERATIONS_EVIDENCE_DIR/results.jsonl")
            printf '%s\n' "$summary"
            printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Operational evidence unavailable; no qualification success is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  container:
    name: Container + image scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Install verified image scanner
        run: |
          mkdir -p "$RUNNER_TEMP/moduleos-tools"
          bash scripts/install-trivy.sh "$RUNNER_TEMP/moduleos-tools"
          echo "$RUNNER_TEMP/moduleos-tools" >> "$GITHUB_PATH"
      - name: Qualify and scan the same production container image
        env:
          GOTOOLCHAIN: local
          MODULEOS_EXPECT_ARCH: ${{ matrix.arch }}
          MODULEOS_SCAN_IMAGE: "1"
        run: ./scripts/check-container-image.sh

  deploy-assets:
    name: Deploy assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Install verified linters
        run: |
          mkdir -p "$RUNNER_TEMP/moduleos-tools"
          bash scripts/install-ci-tools.sh "$RUNNER_TEMP/moduleos-tools"
          echo "$RUNNER_TEMP/moduleos-tools" >> "$GITHUB_PATH"
      - name: Validate scripts, Dockerfile, and complete stack render
        env:
          GOTOOLCHAIN: local
        run: bash scripts/check-deploy-assets.sh
      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  stack-smoke:
    name: Stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Qualify the Swarm deployment contract
        env:
          GOTOOLCHAIN: local
          MODULEOS_STACK_DISPOSABLE: "1"
        run: sudo env PATH="$PATH" GOTOOLCHAIN=local MODULEOS_STACK_DISPOSABLE=1 ./scripts/check-swarm-stack.sh

  vulnerability:
    name: Vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Scan for applicable Go vulnerabilities
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Scan Git history for secrets
        env:
          GOTOOLCHAIN: local
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
