name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Verify formatting
        env:
          GOTOOLCHAIN: local
        run: test -z "$(gofmt -l .)"
      - name: Validate workflows
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify module files are tidy
        env:
          GOTOOLCHAIN: local
        run: go mod tidy -diff
      - name: Verify module dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod verify
      - name: Run static analysis
        env:
          GOTOOLCHAIN: local
        run: go vet ./...
      - name: Run static analysis on the container suite
        env:
          GOTOOLCHAIN: local
        run: go vet -tags container ./apps/control-plane/containertest/...
      - name: Build all packages
        env:
          GOTOOLCHAIN: local
        run: go build ./...
      - name: Qualify moduleosd process lifecycle
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 -v -timeout=3m ./apps/control-plane/cmd/moduleosd
      - name: Verify static moduleosd builds
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-moduleosd-build.sh
      - name: Run tests
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 ./...
      - name: Verify OpenAPI contract
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-openapi.sh
      - name: Verify generated checks leave no changes
        run: git diff --exit-code

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Enforce coverage policy
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-coverage.sh

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Run race-enabled tests
        env:
          GOTOOLCHAIN: local
        run: go test -race -count=1 ./...

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Qualify real Docker and Swarm integration
        env:
          GOTOOLCHAIN: local
          MODULEOS_INTEGRATION_DISPOSABLE: "1"
        run: ./scripts/check-swarm-integration.sh

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Qualify the production container image
        env:
          GOTOOLCHAIN: local
        run: ./scripts/check-container-image.sh

  vulnerability:
    name: Vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Scan for applicable Go vulnerabilities
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Scan Git history for secrets
        env:
          GOTOOLCHAIN: local
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
