name: Bug report
description: Report reproducible behavior that does not match the documented contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ModuleOS. Remove secrets and sensitive data before submitting.

  - type: input
    id: version
    attributes:
      label: ModuleOS version or commit
      description: Provide a release version, image digest, or commit SHA.
      placeholder: v0.x.y or commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, architecture, container/runtime versions, and relevant topology.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and additional evidence
      description: Add redacted logs, screenshots, or other relevant evidence.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed credentials, tokens, private data, and other secrets.
          required: true
        - label: This is not a security vulnerability.
          required: true
